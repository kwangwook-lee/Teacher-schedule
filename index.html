<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>선생님별 시간표 조회</title>
    <!-- Tailwind CSS 적용 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 폰트 적용 (Noto Sans KR) -->

    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }

        th { background-color: #f8fafc; font-weight: 600; color: #475569; }

</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center">

    <div class="max-w-5xl w-full bg-white rounded-2xl shadow-xl overflow-hidden p-6 md:p-10 flex flex-col gap-6">
        
        <!-- 헤더 영역 -->
        <div class="border-b pb-4">
            <h1 class="text-3xl font-bold text-gray-800 tracking-tight">🏫 선생님별 시간표 조회</h1>
            <p class="text-gray-500 mt-2">선생님 이름을 검색하여 이번 학기 시간표를 확인하세요.</p>
        </div>

        <!-- 컨트롤 영역 (검색) -->
        <div class="flex flex-col gap-6 bg-gray-50 p-6 rounded-xl border border-gray-100 max-w-md mx-auto w-full">
            <!-- 선생님 검색 -->
            <div class="flex flex-col gap-2">
                <label class="font-semibold text-gray-700 text-sm">선생님 이름 검색</label>
                <div class="flex gap-2">
                    <input type="text" id="teacherNameInput" placeholder="예: 허영, 김현정" 
                        class="flex-1 border border-gray-300 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                        onkeypress="if(event.key === 'Enter') searchTimetable()">
                    <button onclick="searchTimetable()" 
                        class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium transition-colors shadow-sm">
                        조회
                    </button>
                </div>
            </div>
        </div>

        <!-- 메시지 박스 (알림창 대체) -->
        <div id="messageBox" class="hidden rounded-lg p-4 text-sm font-medium"></div>

        <!-- 결과 테이블 영역 -->

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    인쇄

            </div>
            
            <div class="overflow-x-auto rounded-xl border border-gray-200 shadow-sm">

            "2-1", "2-2", "2-3", "2-4", "2-5", "2-6", "2-7", 
            "3-1", "3-2", "3-3", "3-4", "3-5", "3-6", "3-7"
        ];

        // 메시지 표시 함수 (alert 대체)
        function showMessage(msg, type = 'error') {
            const msgBox = document.getElementById('messageBox');
            msgBox.innerHTML = msg;
            msgBox.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-green-50', 'text-green-600');
            
            if (type === 'error') {
                msgBox.classList.add('bg-red-50', 'text-red-600');
            } else {
                msgBox.classList.add('bg-green-50', 'text-green-600');
            }
        }

        function hideMessage() {
            document.getElementById('messageBox').classList.add('hidden');
        }

        // CSV 파서 함수 (쉼표 구분)
        function parseCSVLine(text) {
            let ret = [], i = 0, p = '', s = true;
            for (let l = text.length; i < l; i++) {
                let c = text[i];
                if (c === '"') {
                    if (s && c === '"') p += c;
                    s = !s;
                } else if (c === ',' && s) {
                    ret.push(p.trim());
                    p = '';
                } else {
                    p += c;
                }
            }
            ret.push(p.trim());
            return ret;
        }

        // 페이지가 열리면 내장된 CSV 데이터를 자동으로 로드합니다.
        window.addEventListener('DOMContentLoaded', () => {
            processCSV(rawCSVData);
        });

        // CSV 데이터를 배열로 변환
        function processCSV(text) {
            const lines = text.split(/\r?\n/);
            csvDataRows = lines.map(line => parseCSVLine(line)).filter(row => row.length > 5);
        }

        // 특정 조건에 맞춰 선생님 이름 추출하는 함수
        function extractTeacherName(rawName) {
            if (!rawName) return "";
            let name = rawName.trim();
            
            // 조건 1: "허영"인 경우 두 글자만
            if (name.startsWith("허영")) {
                return "허영";
            }
            // 조건 2: 그 외에는 모두 앞의 세 글자만 추출 (뒤의 A-1 등 무시)
            if (name.length >= 3) {
                return name.substring(0, 3);
            }
            return name; // 예외 처리 (두 글자 이름 등)
        }

        // 시간표 검색 로직
        function searchTimetable() {
            hideMessage();
            const targetTeacher = document.getElementById('teacherNameInput').value.trim();
            
            if (csvDataRows.length === 0) {
                showMessage("시간표 데이터가 로드되지 않았습니다. 코드 내 rawCSVData를 확인해주세요.");
                return;
            }
            if (!targetTeacher) {
                showMessage("선생님 이름을 입력해주세요.");
                return;
            }

            // 시간표 데이터 구조 초기화 (최대 7교시 기준)
            let maxPeriod = 7; 
            const timetableData = {};
            for (let p = 1; p <= 8; p++) {
                timetableData[p] = { '월': null, '화': null, '수': null, '목': null, '금': null };
            }

            let currentDay = '';
            let isTeacherFound = false;

            // 데이터 순회 (과목 행과 교사 행은 항상 짝을 이룸)
            for (let i = 0; i < csvDataRows.length; i++) {
                const subjectRow = csvDataRows[i];
                
                // '교시'라는 단어가 있는 행이 과목 행이라고 판단
                const periodCell = subjectRow[1] || '';
                if (!periodCell.includes('교시')) continue;
                
                const periodNumber = parseInt(periodCell.replace(/[^0-9]/g, ''));
                if (periodNumber > maxPeriod) maxPeriod = periodNumber;

                // 요일 업데이트 (요일이 적혀있는 경우 갱신)
                const dayVal = subjectRow[0];
                if (dayVal && days.includes(dayVal)) {
                    currentDay = dayVal;
                }

                if (!currentDay) continue; // 요일을 파악할 수 없으면 건너뜀

                // 다음 행은 선생님 이름이 있는 행
                const teacherRow = csvDataRows[i + 1];
                if (!teacherRow) continue;

                // 각 반(열)별로 데이터 확인 (열 인덱스 2번부터 시작)
                for (let col = 2; col <= 21; col++) {
                    const subject = subjectRow[col] || '';
                    const rawTeacher = teacherRow[col] || '';

                    if (!subject || !rawTeacher) continue;

                    const teacherName = extractTeacherName(rawTeacher);

                    // 선생님 이름이 일치하면 시간표에 등록
                    if (teacherName === targetTeacher) {
                        isTeacherFound = true;
                        const targetClass = classNames[col - 2] || '기타';
                        
                        // 이미 해당 교시에 일정이 있다면 (합반의 경우), 텍스트를 이어붙임
                        if (timetableData[periodNumber][currentDay]) {
                             timetableData[periodNumber][currentDay].class += `, ${targetClass}`;
                        } else {
                            timetableData[periodNumber][currentDay] = {
                                subject: subject,
                                class: targetClass
                            };
                        }
                    }
                }
            }

            if (!isTeacherFound) {
                showMessage(`'${targetTeacher}' 선생님의 시간표 데이터를 찾을 수 없습니다. 이름을 확인해주세요.`);
                document.getElementById('resultArea').classList.add('hidden');
                return;
            }

            renderTable(timetableData, targetTeacher, maxPeriod);
        }

        // HTML 테이블 렌더링
        function renderTable(data, teacherName, maxPeriod) {
            document.getElementById('resultTeacherName').textContent = teacherName;
            const tbody = document.getElementById('timetableBody');
            tbody.innerHTML = '';

            for (let p = 1; p <= maxPeriod; p++) {
                const tr = document.createElement('tr');
                // 교시 열
                const th = document.createElement('td');
                th.className = 'font-bold bg-gray-50 text-gray-700';
                th.textContent = `${p}교시`;
                tr.appendChild(th);

                // 요일별 데이터 열
                days.forEach(day => {
                    const td = document.createElement('td');
                    const cellData = data[p][day];
                    
                    if (cellData) {
                        td.className = 'bg-blue-50/50 hover:bg-blue-50 transition-colors';
                        td.innerHTML = `
                            <div class="subject-cell">${cellData.subject}</div>
                            <div class="class-cell">${cellData.class}</div>
                        `;
                    } else {
                        td.innerHTML = `<div class="text-gray-300">-</div>`;
                    }
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            }

            document.getElementById('resultArea').classList.remove('hidden');
        }
    </script>
</body>
